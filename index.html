<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>별점 테스트</title></head>
<body style="background:#111;color:#fff;padding:40px;font-family:sans-serif">
<h2>별점 렌더링 테스트</h2>

<script>
function renderStars(rating, size='0.9rem'){
  const full=Math.floor(rating);
  const half=rating-full>=0.5;
  const empty=5-full-(half?1:0);
  const halfStar=half?`<span style="position:relative;display:inline-block;font-size:${size};line-height:1;vertical-align:middle"><span style="color:#444">★</span><span style="position:absolute;left:0;top:0;width:50%;overflow:hidden;color:#ffd700">★</span></span>`:'';
  return `<span style="color:#ffd700;font-size:${size};vertical-align:middle;line-height:1">${'★'.repeat(full)}</span>${halfStar}<span style="color:#444;font-size:${size};vertical-align:middle;line-height:1">${'★'.repeat(empty)}</span>`;
}

const tests = [
  { label: '3.5점 (문제의 케이스)', rating: 3.5 },
  { label: '1점', rating: 1 },
  { label: '1.5점', rating: 1.5 },
  { label: '2점', rating: 2 },
  { label: '2.5점', rating: 2.5 },
  { label: '3점', rating: 3 },
  { label: '4점', rating: 4 },
  { label: '4.5점', rating: 4.5 },
  { label: '5점', rating: 5 },
];

document.addEventListener('DOMContentLoaded', () => {
  const div = document.getElementById('result');
  tests.forEach(t => {
    div.innerHTML += `
      <div style="margin:16px 0;display:flex;align-items:center;gap:16px">
        <span style="width:180px;color:#aaa">${t.label}</span>
        <span style="font-size:1.4rem">${renderStars(t.rating, '1.4rem')}</span>
        <span style="font-size:0.9rem">${renderStars(t.rating, '0.9rem')}</span>
      </div>`;
  });
});
</script>

<div id="result"></div>
</body>
</html>
